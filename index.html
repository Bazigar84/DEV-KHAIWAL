    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #2e0854 0%, #120224 70%, #080012 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            color: #ffffff;
            padding: 20px 15px 100px 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* Star Background Animation */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
            margin: auto 0;
        }

        /* Logo Styling */
        .logo-container {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #000;
            border: 3px solid #ffd700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .logo-title {
            color: #ffd700;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 1px;
            line-height: 1.2;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }

        .logo-subtitle {
            color: #ffffff;
            font-size: 8px;
            letter-spacing: 2px;
            margin-top: 2px;
        }

        /* Main Heading */
        .main-title {
            color: #ffffff;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.8), 0 0 20px rgba(0, 229, 255, 0.4);
            text-align: center;
        }

        /* Card Container */
        .card {
            width: 100%;
            background: rgba(22, 10, 45, 0.75);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 20px;
            padding: 22px 18px;
            box-shadow: 0 0 30px rgba(112, 0, 255, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        /* Rates Box */
        .rates-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }

        .rate-box {
            background: rgba(30, 15, 60, 0.8);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 12px;
            padding: 10px 8px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .rate-title {
            color: #00e5ff;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            text-transform: uppercase;
        }

        .rate-value {
            color: #ffd700;
            font-size: 16px;
            font-weight: 900;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
        }

        /* Badges */
        .badges-container {
            background: rgba(20, 8, 40, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            font-size: 12px;
            font-weight: 700;
        }

        .badge-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #ffffff;
        }

        .badge-check {
            background: #22c55e;
            color: #000;
            width: 16px;
            height: 16px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 900;
        }

        .badge-divider {
            color: rgba(255, 255, 255, 0.3);
        }

        /* Hindi Taglines */
        .taglines {
            text-align: center;
            margin-bottom: 20px;
        }

        .tagline-1 {
            color: #ffffff;
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 6px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        .tagline-2 {
            color: #ff4d4d;
            font-size: 14px;
            font-weight: 700;
            text-shadow: 0 0 8px rgba(255, 77, 77, 0.5);
        }

        /* Markets Section */
        .markets-section {
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 14px;
            padding: 15px 12px;
            background: rgba(15, 5, 30, 0.6);
        }

        .markets-header {
            color: #ffd700;
            font-size: 13px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .markets-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .market-item {
            background: rgba(35, 15, 70, 0.6);
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 8px;
            padding: 8px;
            font-size: 11px;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .market-dot {
            width: 6px;
            height: 6px;
            background-color: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 5px #ffd700;
        }

        /* Fixed Bottom Telegram Button */
        .btn-container {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0 15px;
            z-index: 100;
        }

        .telegram-btn {
            width: 100%;
            max-width: 480px;
            background: linear-gradient(180deg, #00d2ff 0%, #0088cc 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 30px;
            font-size: 17px;
            font-weight: 900;
            letter-spacing: 1px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 136, 204, 0.8), 0 5px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            animation: pulse 2s infinite;
        }

        .telegram-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(0, 136, 204, 1);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

    <!-- JavaScript for Stars Background -->
    <script>
        const starsContainer = document.getElementById('starsContainer');
        const starCount = 60;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            
            // Random sizes, positions, and animation duration
            const size = Math.random() * 3 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
            star.style.animationDelay = `${Math.random() * 3}s`;

            starsContainer.appendChild(star);
        }
    </script>
